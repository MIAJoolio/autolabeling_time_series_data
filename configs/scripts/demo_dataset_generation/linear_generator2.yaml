blocks:
  - block1: 
    ts_generator: "linear"
    ts_params: 
      slope_d: 0.5
      slope_u: 0.9
      slope_q: 100
    noise_generator: "normal"
    noise_params:
      noise_pct_d: 0
      noise_pct_u: 0.05
      noise_pct_q: 100

  - block2:  
    ts_generator: "linear"
    ts_params: 
      slope_d: -0.9
      slope_u: -0.5
      slope_q: 100
    noise_generator: "normal"
    noise_params:
      noise_pct_d: 0
      noise_pct_u: 0.05
      noise_pct_q: 100

